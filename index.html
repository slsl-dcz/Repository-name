<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能会商多场景协同管理系统</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

    <!-- 顶部导航栏 -->
    <header class="top-navbar">
        <div class="navbar-brand">
            <i class="fas fa-comments"></i>
            <span>智能会商协同系统</span>
        </div>
        <div class="navbar-actions">
            <div class="notification-icon">
                <i class="fas fa-bell"></i>
                <span class="notification-badge">3</span>
            </div>
            <div class="user-profile">

                <span>管理员</span>
                <i class="fas fa-chevron-down"></i>
            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 侧边导航栏 -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul class="nav-menu">
                    <li class="nav-item active" data-page="dashboard">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>系统概览</span>
                    </li>
                    <li class="nav-item" data-page="meetings">
                        <i class="fas fa-video"></i>
                        <span>会商会议</span>
                    </li>
                    <li class="nav-item" data-page="participants">
                        <i class="fas fa-users"></i>
                        <span>参会人员</span>
                    </li>
                    <li class="nav-item" data-page="documents">
                        <i class="fas fa-file-alt"></i>
                        <span>文档资料</span>
                    </li>
                    <li class="nav-item" data-page="decisions">
                        <i class="fas fa-gavel"></i>
                        <span>决策记录</span>
                    </li>
                    <li class="nav-item" data-page="tasks">
                        <i class="fas fa-tasks"></i>
                        <span>任务跟踪</span>
                    </li>
                    <li class="nav-item" data-page="analytics">
                        <i class="fas fa-chart-bar"></i>
                        <span>数据分析</span>
                    </li>
                    <li class="nav-item" data-page="settings">
                        <i class="fas fa-cog"></i>
                        <span>系统设置</span>
                    </li>
                    <li class="nav-item" data-page="permissions">
                        <i class="fas fa-shield-alt"></i>
                        <span>权限管理</span>
                    </li>
                    <li class="nav-item" data-page="notifications">
                        <i class="fas fa-bell"></i>
                        <span>消息通知</span>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- 面包屑导航 -->
            <div class="breadcrumb">
                <span class="breadcrumb-item">首页</span>
                <i class="fas fa-chevron-right"></i>
                <span class="breadcrumb-item current">系统概览</span>
            </div>

            <!-- 页面内容容器 -->
            <div class="page-container">
                <!-- 各个页面内容将在这里动态加载 -->
            </div>
        </main>
    </div>

    <!-- 模态框容器 -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title"></h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-cancel">取消</button>
                <button class="btn btn-primary modal-confirm">确认</button>
            </div>
        </div>
    </div>

    <!-- 提示消息容器 -->
    <div id="toast-container" class="toast-container"></div>

    <!-- 脚本文件 -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
